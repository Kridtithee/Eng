<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Vocab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>📘 My Vocab</h1>
  <nav>
    <button class="tab on" data-t="list" onclick="show('list')">รายการ</button>
    <button class="tab" data-t="cards" onclick="show('cards')">แฟลชการ์ด</button>
    <button class="tab" data-t="quiz" onclick="show('quiz')">ควิซ</button>
  </nav>
</header>

<main>
  <section id="list">
    <input id="q" type="search" placeholder="ค้นหา คำ / ความหมาย / synonym..." oninput="render()">
    <label><input type="checkbox" id="hide" onchange="render()"> ซ่อนคำที่จำได้แล้ว</label>
    <p id="count"></p>
    <div id="listbox"></div>
  </section>

  <section id="cards" hidden>
    <label><input type="checkbox" id="hide2" onchange="resetDeck()"> เฉพาะคำที่ยังไม่จำ</label>
    <div id="card" onclick="flip()"></div>
    <p id="pos"></p>
    <div class="row">
      <button onclick="move(-1)">◀ ก่อนหน้า</button>
      <button onclick="flip()">พลิก</button>
      <button onclick="move(1)">ถัดไป ▶</button>
    </div>
    <div class="row">
      <button onclick="shuffleDeck()">🔀 สลับ</button>
      <button onclick="markCurrent()">✅ จำได้แล้ว</button>
    </div>
  </section>

  <section id="quiz" hidden>
    <p id="score"></p>
    <div id="qbox"></div>
  </section>
</main>

<script src="vocab.js"></script>
<script src="app.js"></script>
</body>
</html>
